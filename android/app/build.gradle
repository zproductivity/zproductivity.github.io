plugins {
    id 'com.android.application'
}

// URL Web App Apps Script. Diisi dari GitHub repository variable WEB_APP_URL,
// atau ganti nilai default di bawah ini.
def webAppUrl = (project.findProperty('WEB_APP_URL') ?: '').toString().trim()
if (!webAppUrl) {
    webAppUrl = 'https://script.google.com/macros/s/AKfycbxwsxIZZzC1twc0gBy6GzD5v-7XH3UvuCHN19kWCahZhGoUBr4zd1vVPc2OrNv4pOfP/exec'
}

android {
    namespace 'id.zend.zproductivity'
    compileSdk 34

    defaultConfig {
        applicationId 'id.zend.zproductivity'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'WEB_APP_URL', "\"${webAppUrl}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
