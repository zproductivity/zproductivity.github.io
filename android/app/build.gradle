plugins {
    id 'com.android.application'
}

// Halaman yang dibuka APK: pembungkus di GitHub Pages (tanpa banner Google, ukuran layar pas).
def appUrl = (project.findProperty('APP_URL') ?: '').toString().trim()
if (!appUrl) {
    appUrl = 'https://zproductivity.github.io/'
}

android {
    namespace 'id.zend.zproductivity'
    compileSdk 34

    defaultConfig {
        applicationId 'id.zend.zproductivity'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.2'
        buildConfigField 'String', 'WEB_APP_URL', "\"${appUrl}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
