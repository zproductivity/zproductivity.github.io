<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#131A2E}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Roboto,sans-serif;color:#E8ECF4;display:grid;place-items:center;
  background:radial-gradient(120% 80% at 50% 100%,#1E2A55 0%,#131A2E 62%);-webkit-font-smoothing:antialiased}
.box{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
svg{width:min(74vw,300px);height:auto;overflow:visible}
.axis{stroke:rgba(255,255,255,.12);stroke-width:1}
.curve{fill:none;stroke:#FFB21E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,178,30,.55))}
.dot{fill:#fff;filter:drop-shadow(0 0 8px #FFB21E)}
.held .dot{animation:p 1.3s ease-in-out infinite}
@keyframes p{50%{r:8px;opacity:.75}}
.word{font-weight:800;font-size:28px;letter-spacing:-.02em;margin-top:26px;opacity:0;transform:translateY(8px);animation:in .6s .25s ease forwards}
.calc{font-variant-numeric:tabular-nums;font-size:15px;color:#9AA3B8;margin-top:4px}
.calc sup{font-size:10px}
.calc b{color:#FFB21E;font-weight:700}
.tag{margin-top:22px;font-size:12px;color:#66708A;letter-spacing:.02em;opacity:0;animation:in .6s .9s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.word,.tag{animation:none;opacity:1;transform:none}.held .dot{animation:none}}
</style>
</head>
<body>
<div class="box" id="box">
  <svg viewBox="0 0 260 150" aria-hidden="true">
    <line x1="12" y1="138" x2="248" y2="138" class="axis"/>
    <line x1="12" y1="14" x2="12" y2="138" class="axis"/>
    <path id="P" class="curve" d="M12,138"/>
    <circle id="D" class="dot" r="5" cx="12" cy="138"/>
  </svg>
  <div class="word">Z-Productivity</div>
  <div class="calc">1,01<sup id="DY">1</sup> = <b id="V">1,01</b></div>
  <div class="tag">Work 1% daily</div>
</div>
<script>
(function(){
  var P=document.getElementById('P'),D=document.getElementById('D'),DY=document.getElementById('DY'),V=document.getElementById('V');
  var MAX=Math.pow(1.01,365),X0=12,X1=248,Y0=138,Y1=14;
  function pt(d){return [X0+(X1-X0)*(d-1)/364, Y0-(Y0-Y1)*(Math.pow(1.01,d)-1)/(MAX-1)];}
  function draw(day){
    var s='M'+X0+','+Y0;
    for(var i=4;i<day;i+=4){var q=pt(i);s+=' L'+q[0].toFixed(1)+','+q[1].toFixed(1);}
    var p=pt(day); s+=' L'+p[0].toFixed(1)+','+p[1].toFixed(1);
    P.setAttribute('d',s); D.setAttribute('cx',p[0].toFixed(1)); D.setAttribute('cy',p[1].toFixed(1));
    DY.textContent=day; V.textContent=Math.pow(1.01,day).toFixed(2).replace('.',',');
  }
  function finish(){draw(365);document.getElementById('box').classList.add('held');}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return;}
  var t0=null,dur=2300;
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function f(now){ if(t0===null)t0=now; var t=Math.min(1,(now-t0)/dur);
    draw(Math.max(1,Math.round(1+364*ease(t)))); if(t<1)requestAnimationFrame(f); else finish(); }
  requestAnimationFrame(f);
})();
</script>
</body>
</html>
