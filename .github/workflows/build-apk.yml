name: Build APK Z-Productivity

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/build-apk.yml' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug -PWEB_APP_URL="${{ vars.WEB_APP_URL }}" --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Z-Productivity.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Z-Productivity-apk
          path: Z-Productivity.apk

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Z-Productivity.apk
